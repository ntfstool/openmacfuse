<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 326" width="960" height="326" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="960" height="326" rx="12" fill="#ffffff" stroke="#d9dee8"/>
<text x="28" y="34" font-size="15" font-weight="700" fill="#1c2333">Metadata-heavy workloads (disk image, Apple M2, macOS 27.0.1)</text><rect x="28" y="46" width="12" height="12" rx="3" fill="#2257f5"/><text x="46" y="57" font-size="12" fill="#1c2333">OpenMacFUSE</text><rect x="148" y="46" width="12" height="12" rx="3" fill="#b6bdca"/><text x="166" y="57" font-size="12" fill="#1c2333">FUSE-T 1.0.49</text><text x="278" y="57" font-size="12" fill="#5b6478">time, shorter is better</text><text x="28" y="84" font-size="13" fill="#1c2333">stat + MD5 of every file on the volume</text><text x="932" y="84" text-anchor="end" font-size="13" font-weight="700" fill="#2257f5">35x</text><rect x="28" y="92" width="20" height="16" rx="4" fill="#2257f5"/><text x="56" y="105" font-size="12" fill="#1c2333">22.8 s</text><rect x="28" y="114" width="700" height="16" rx="4" fill="#b6bdca"/><text x="736" y="127" font-size="12" fill="#1c2333">796.9 s</text><text x="28" y="158" font-size="13" fill="#1c2333">Delete 10,000 files of 4 KB</text><text x="932" y="158" text-anchor="end" font-size="13" font-weight="700" fill="#2257f5">6-9x</text><rect x="28" y="166" width="91" height="16" rx="4" fill="#2257f5"/><text x="127" y="179" font-size="12" fill="#1c2333">1.86-2.26 s</text><rect x="28" y="188" width="700" height="16" rx="4" fill="#b6bdca"/><text x="736" y="201" font-size="12" fill="#1c2333">11.2-20.7 s</text><text x="28" y="232" font-size="13" fill="#1c2333">200,000 small-file create/delete operations</text><text x="932" y="232" text-anchor="end" font-size="13" font-weight="700" fill="#2257f5">6.5x</text><rect x="28" y="240" width="108" height="16" rx="4" fill="#2257f5"/><text x="144" y="253" font-size="12" fill="#1c2333">205-218 s</text><rect x="28" y="262" width="700" height="16" rx="4" fill="#b6bdca"/><text x="736" y="275" font-size="12" fill="#1c2333">1365 s</text><text x="28" y="312" font-size="11" fill="#5b6478">Same FUSE file system source built twice, once against each library. Image on the internal SSD, so the numbers show mount-layer overhead, not disk speed.</text></svg>
